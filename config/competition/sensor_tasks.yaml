schema_version: 1
status: development_only_field_calibration_and_collision_validation_pending
calibration: config/cameras/dabai_sim_placeholder.yaml
# Public task card assumption for this demonstration, not an inferred official mapping.
l1_mapping: {red: red, green: green, yellow: yellow}
# Explicitly provisional colour-category task card; orange/brown policy is NOT
# an official competition rule. Replace this card when the organiser publishes it.
l2_mapping_status: provisional_simulation_card_not_official
l2_color_mapping: {red: red, green: green, yellow: yellow, orange_brown: yellow, yellow_green: green}
l2_observation_q_rad:
  - [0.0, 0.05, -0.60, 0.0, 1.20, 0.0]
  - [0.0, 0.40, -0.80, 0.0, 1.20, 0.0]
  - [-0.65, 0.40, -0.80, 0.0, 1.20, 0.0]
  - [0.65, 0.40, -0.80, 0.0, 1.20, 0.0]
# Joint-space observation poses are task-independent, not object coordinates.
observation_q_rad:
  - [0.0, 0.4, -0.8, 0.0, 1.2, 0.0]
  - [-0.65, 0.4, -0.8, 0.0, 1.2, 0.0]
  - [0.65, 0.4, -0.8, 0.0, 1.2, 0.0]
  - [-1.05, 0.4, -0.8, 0.0, 1.2, 0.0]
  - [1.05, 0.4, -0.8, 0.0, 1.2, 0.0]
max_attempts: 2
l2_max_attempts_per_object: 3
l2_max_search_passes: 2
l2_planning_budget_s: 12.0
time_limits_s: {l1: 180, l2: 300}
# Inference and perception wall time must count in the competition budget.
max_frame_age_s: 0.25
verification_interval_s: 0.4
verification_duration_s: 3.2
segmentation:
  default: sam2
  sam2_config: config/segmentation/sam2.yaml
  sam31_config: config/segmentation/sam31.yaml
